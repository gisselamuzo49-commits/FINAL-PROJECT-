services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_MULTIPLE_DATABASES=auth_db,internship_db,user_db,linkage_db
    volumes:
      - postgres-data-volume:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: always

  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    container_name: auth-service-local
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres-db
    restart: always

  internship-service:
    build:
      context: ./apps/internship-service
      dockerfile: Dockerfile
    container_name: internship-service-local
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=internship_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres-db
    restart: always

  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: user-service-local
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=user_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres-db
    restart: always

  linkage-service:
    build:
      context: ./apps/linkage-service
      dockerfile: Dockerfile
    container_name: linkage-service-local
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=linkage_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres-db
    restart: always

  gateway-service:
    build:
      context: ./apps/gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service-local
    ports:
      - "8082:8082"
    environment:
      - AUTH_SERVICE_URL=http://auth-service-local:8080
      - INTERNSHIP_SERVICE_URL=http://internship-service-local:8081
      - USER_SERVICE_URL=http://user-service-local:8083
      - LINKAGE_SERVICE_URL=http://linkage-service-local:8084
      - JWT_SECRET=v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq
    depends_on:
      - auth-service
      - internship-service
      - user-service
      - linkage-service
    restart: always

  frontend-web:
    build:
      context: ./apps/frontend-web
      dockerfile: Dockerfile
      args:
        - VITE_AUTH_PORT=8080
        - VITE_INTERNSHIP_PORT=8081
        - VITE_USER_PORT=8083
        - VITE_LINKAGE_PORT=8084
        - VITE_GATEWAY_PORT=8082
    container_name: frontend-web-local
    ports:
      - "80:80"
    depends_on:
      - gateway-service
    restart: always

volumes:
  postgres-data-volume:
