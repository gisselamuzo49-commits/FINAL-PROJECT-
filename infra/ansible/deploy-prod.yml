---
# ─────────────────────────────────────────
# Ansible Playbook — Deploy PROD
# Despliega todos los servicios en el EC2 de PROD
# ─────────────────────────────────────────
- name: Deploy PROD — todos los servicios
  hosts: all
  become: true

  vars:
    docker_image_auth:        "gdmuzo/auth-service:latest"
    docker_image_internship:  "gdmuzo/internship-service:latest"
    docker_image_user:        "gdmuzo/user-service:latest"
    docker_image_linkage:     "gdmuzo/linkage-service:latest"
    docker_image_gateway:     "gdmuzo/gateway-service:latest"
    docker_image_frontend:    "gdmuzo/frontend-web:latest"
    postgres_image:           "postgres:15-alpine"
    redis_image:              "redis:7-alpine"
    neo4j_password:           "password123"

  tasks:

    - name: Detener y remover contenedores existentes
      shell: |
        docker stop auth-service internship-service user-service linkage-service gateway-service frontend-web hours-service evaluation-service notification-service document-service report-service ai-service 2>/dev/null || true
        docker rm   auth-service internship-service user-service linkage-service gateway-service frontend-web hours-service evaluation-service notification-service document-service report-service ai-service 2>/dev/null || true

    - name: Prune unused Docker images, containers and networks
      shell: docker system prune -af || true

    - name: Clean apt cache
      shell: apt-get clean && rm -rf /var/lib/apt/lists/* || true

    - name: Truncate large log files and vacuum journal
      shell: |
        find /var/log -type f -name "*.log" -size +10M -exec truncate -s 0 {} \; || true
        journalctl --vacuum-size=50M || true

    # ── Prerequisitos ────────────────────
    - name: Asegurar que Docker está corriendo
      shell: |
        systemctl enable docker || true
        systemctl is-active --quiet docker || systemctl start docker
      changed_when: false

    # ── Docker Hub login en el EC2 ────────
    - name: Login en Docker Hub
      shell: |
        echo "{{ dockerhub_token }}" | docker login --username "{{ dockerhub_username }}" --password-stdin
      no_log: true

    - name: Crear directorio de configuracion para Mosquitto
      file:
        path: /opt/mosquitto
        state: directory
        mode: "0755"

    - name: Crear archivo mosquitto.conf
      copy:
        dest: /opt/mosquitto/mosquitto.conf
        content: |
          listener 1883
          allow_anonymous false
          password_file /mosquitto/config/passwd
        mode: "0644"

    - name: Crear archivo passwd de Mosquitto
      copy:
        dest: /opt/mosquitto/passwd
        content: |
          notifuser:$7$1000$Zc6Qk2Ubevt5hnmzbgPUcbc+2EvRDl6JNXksU29ldzze1AIsTkTS7Y+02hVG396rrzU1iutZmrAHUiRPFMXKsw==$jeMgp8UyhHcLjlp9cDGGUvpyUsccIM0hKCWASCqlWhSRybSRfG/5sDzqiI1dnoP1RcyX5ooY6dyxTHGqha8quA==
        mode: "0644"

    - name: Crear volúmenes persistentes para bases de datos
      shell: |
        docker volume create postgres_data 2>/dev/null || true
        docker volume create mongodb_data 2>/dev/null || true
        docker volume create neo4j_data 2>/dev/null || true
        docker volume create redis_data 2>/dev/null || true
        docker volume create n8n_data 2>/dev/null || true
        docker volume create cassandra_data 2>/dev/null || true
        docker volume create elasticsearch_data 2>/dev/null || true
        docker volume create influxdb_data 2>/dev/null || true

    - name: Asegurar que existe la red de Docker para intercomunicación
      shell: docker network create pasantias-net 2>/dev/null || true

    - name: Crear directorio para scripts de inicialización de Postgres
      file:
        path: /opt/postgres-init
        state: directory
        mode: "0755"

    - name: Crear script de inicialización de múltiples bases de datos
      copy:
        dest: /opt/postgres-init/init-multiple-dbs.sh
        mode: "0755"
        content: |
          #!/bin/bash
          set -e
          set -u
          function create_user_and_database() {
              local database=$1
              echo "  Creating database '$database'"
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" <<-EOSQL
                  CREATE DATABASE $database;
                  GRANT ALL PRIVILEGES ON DATABASE $database TO $POSTGRES_USER;
          EOSQL
          }
          if [ -n "$POSTGRES_MULTIPLE_DATABASES" ]; then
              for db in $(echo $POSTGRES_MULTIPLE_DATABASES | tr ',' ' '); do
                  create_user_and_database $db
              done
          fi

          psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" <<-'EOSQL'
              \c auth_db;
              CREATE TABLE IF NOT EXISTS users (
                id BIGSERIAL PRIMARY KEY,
                email VARCHAR(255) NOT NULL UNIQUE,
                password VARCHAR(255) NOT NULL,
                nombre VARCHAR(255) NOT NULL,
                rol VARCHAR(50) NOT NULL DEFAULT 'ESTUDIANTE'
              );
              INSERT INTO users (nombre, email, password, rol) VALUES
                ('Estudiante Test', 'estudiante@uce.edu.ec',
                 '$2a$10$1b.WUFZVb/vY4mIlKavCEOTlflS9/jFW.POQBFZ3m8wbbhUmoFuRG',
                 'ESTUDIANTE'),
                ('Tutor Test', 'tutor@uce.edu.ec',
                 '$2a$10$1b.WUFZVb/vY4mIlKavCEOTlflS9/jFW.POQBFZ3m8wbbhUmoFuRG',
                 'TUTOR'),
                ('Coordinador Test', 'coordinador@uce.edu.ec',
                 '$2a$10$1b.WUFZVb/vY4mIlKavCEOTlflS9/jFW.POQBFZ3m8wbbhUmoFuRG',
                 'COORDINADOR')
              ON CONFLICT (email) DO NOTHING;
          EOSQL

    # ── Pull de imágenes ─────────────────
    - name: Pull postgres image
      shell: docker pull {{ postgres_image }}

    - name: Pull redis image
      shell: docker pull {{ redis_image }}

    - name: Pull auth-service image
      shell: docker pull {{ docker_image_auth }}

    - name: Pull internship-service image
      shell: docker pull {{ docker_image_internship }}

    - name: Pull user-service image
      shell: docker pull {{ docker_image_user }}

    - name: Pull linkage-service image
      shell: docker pull {{ docker_image_linkage }}

    - name: Pull gateway-service image
      shell: docker pull {{ docker_image_gateway }}

    - name: Pull frontend-web image
      shell: docker pull {{ docker_image_frontend }}

    - name: Pull neo4j image
      shell: docker pull neo4j:5-community

    - name: Pull zookeeper image
      shell: docker pull confluentinc/cp-zookeeper:7.6.0

    - name: Pull kafka image
      shell: docker pull confluentinc/cp-kafka:7.6.0

    - name: Pull mongodb image
      shell: docker pull mongo:7

    - name: Pull rabbitmq image
      shell: docker pull rabbitmq:3-management-alpine

    - name: Pull hours-service image
      shell: docker pull gdmuzo/hours-service:latest

    - name: Pull evaluation-service image
      shell: docker pull gdmuzo/evaluation-service:latest

    - name: Pull notification-service image
      shell: docker pull gdmuzo/notification-service:latest

    - name: Pull document-service image
      shell: docker pull gdmuzo/document-service:latest

    - name: Pull report-service image
      shell: docker pull gdmuzo/report-service:latest

    - name: Pull ai-service image
      shell: docker pull gdmuzo/ai-service:latest

    - name: Pull mosquitto image
      shell: docker pull eclipse-mosquitto:2.0

    - name: Pull cassandra image
      shell: docker pull cassandra:4.1
      async: 300
      poll: 10

    - name: Pull elasticsearch image
      shell: docker pull elasticsearch:8.12.0
      async: 300
      poll: 10

    - name: Pull influxdb image
      shell: docker pull influxdb:2.7
      async: 300
      poll: 10

    - name: Pull etcd image
      shell: docker pull gcr.io/etcd-development/etcd:v3.5.0
      async: 300
      poll: 10

    # ── Levantar contenedores ────────────
    - name: Levantar postgres-db
      shell: |
        docker ps --filter "name=postgres-db" --filter "status=running" | grep -q postgres-db || \
        (docker rm -f postgres-db 2>/dev/null || true; \
         docker run -d \
           --name postgres-db \
           --network pasantias-net \
           --restart always \
           -p 5432:5432 \
           -e POSTGRES_USER=postgres \
           -e POSTGRES_PASSWORD=postgres \
           -e POSTGRES_DB=postgres \
           -e POSTGRES_MULTIPLE_DATABASES=auth_db,internship_db,user_db,linkage_db,hours_db,evaluation_db,notification_db,document_db,report_db \
           -v postgres_data:/var/lib/postgresql/data \
           -v /opt/postgres-init:/docker-entrypoint-initdb.d \
           {{ postgres_image }})

    - name: Esperar a que la base de datos esté lista
      pause:
        seconds: 10

    - name: Verificar que postgres-db está saludable
      shell: |
        for i in $(seq 1 15); do
          docker exec postgres-db pg_isready -U postgres && exit 0
          sleep 2
        done
        exit 1

    - name: Levantar auth-service
      shell: |
        docker run -d \
          --name auth-service \
          --network pasantias-net \
          --restart always \
          -p 8080:8080 \
          -e DB_HOST=postgres-db \
          -e DB_PORT=5432 \
          -e DB_NAME=auth_db \
          -e DB_USER=postgres \
          -e DB_PASSWORD=postgres \
          -e JWT_SECRET='v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq' \
          {{ docker_image_auth }}

    - name: Levantar internship-service
      shell: |
        docker run -d \
          --name internship-service \
          --network pasantias-net \
          --restart always \
          -p 8081:8081 \
          -e DB_HOST=postgres-db \
          -e DB_PORT=5432 \
          -e DB_NAME=internship_db \
          -e DB_USER=postgres \
          -e DB_PASSWORD=postgres \
          -e NEO4J_URI=bolt://neo4j:7687 \
          -e NEO4J_USER=neo4j \
          -e NEO4J_PASSWORD={{ neo4j_password }} \
          {{ docker_image_internship }}

    - name: Levantar user-service
      shell: |
        docker run -d \
          --name user-service \
          --network pasantias-net \
          --restart always \
          -p 8083:8083 \
          -e DB_HOST=postgres-db \
          -e DB_PORT=5432 \
          -e DB_NAME=user_db \
          -e DB_USER=postgres \
          -e DB_PASSWORD=postgres \
          {{ docker_image_user }}

    - name: Levantar linkage-service
      shell: |
        docker run -d \
          --name linkage-service \
          --network pasantias-net \
          --restart always \
          -p 8084:8084 \
          -e DB_HOST=postgres-db \
          -e DB_PORT=5432 \
          -e DB_NAME=linkage_db \
          -e DB_USER=postgres \
          -e DB_PASSWORD=postgres \
          {{ docker_image_linkage }}

    - name: Levantar redis
      shell: |
        docker ps --filter "name=redis" --filter "status=running" | grep -q redis || \
        (docker rm -f redis 2>/dev/null || true; \
         docker run -d \
           --name redis \
           --network pasantias-net \
           --restart always \
           -p 6379:6379 \
           -v redis_data:/data \
           redis:7-alpine)

    - name: Verificar que redis está saludable
      shell: |
        for i in $(seq 1 10); do
          docker exec redis redis-cli ping | grep -q PONG && exit 0
          sleep 2
        done
        exit 1

    - name: Levantar mosquitto
      shell: |
        docker ps --filter "name=mosquitto" --filter "status=running" | grep -q mosquitto || \
        (docker rm -f mosquitto 2>/dev/null || true; \
         docker run -d \
           --name mosquitto \
           --network pasantias-net \
           --restart always \
           -p 1883:1883 \
           -v /opt/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf \
           -v /opt/mosquitto/passwd:/mosquitto/config/passwd \
           eclipse-mosquitto:2.0)

    - name: Levantar neo4j
      shell: >
        docker ps --filter "name=neo4j" --filter "status=running" | grep -q neo4j ||
        (docker rm -f neo4j 2>/dev/null || true;
        docker run -d --name neo4j
        --network pasantias-net
        --restart always
        -p 7474:7474
        -p 7687:7687
        -e NEO4J_AUTH=neo4j/{{ neo4j_password }}
        -v neo4j_data:/data
        neo4j:5-community)

    - name: Levantar zookeeper
      shell: >
        docker ps --filter "name=zookeeper" --filter "status=running" | grep -q zookeeper ||
        (docker rm -f zookeeper 2>/dev/null || true;
        docker run -d --name zookeeper
        --network pasantias-net
        --restart always
        -e ZOOKEEPER_CLIENT_PORT=2181
        -e ZOOKEEPER_TICK_TIME=2000
        confluentinc/cp-zookeeper:7.6.0)

    - name: Levantar kafka
      shell: >
        docker ps --filter "name=kafka" --filter "status=running" | grep -q kafka ||
        (docker rm -f kafka 2>/dev/null || true;
        docker run -d --name kafka
        --network pasantias-net
        --restart always
        -p 9092:9092
        -e KAFKA_BROKER_ID=1
        -e KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
        -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
        -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
        confluentinc/cp-kafka:7.6.0)

    - name: Esperar a que Kafka esté listo
      shell: sleep 20

    - name: Levantar mongodb
      shell: >
        docker ps --filter "name=mongodb" --filter "status=running" | grep -q mongodb ||
        (docker rm -f mongodb 2>/dev/null || true;
        docker run -d --name mongodb
        --network pasantias-net
        --restart always
        -p 27017:27017
        -v mongodb_data:/data/db
        mongo:7)

    - name: Verificar que mongodb está saludable
      shell: |
        for i in $(seq 1 10); do
          docker exec mongodb mongosh --eval "db.runCommand('ping').ok" --quiet && exit 0
          sleep 2
        done
        exit 1

    - name: Levantar rabbitmq
      shell: >
        docker ps --filter "name=rabbitmq" --filter "status=running" | grep -q rabbitmq ||
        (docker rm -f rabbitmq 2>/dev/null || true;
        docker run -d --name rabbitmq
        --network pasantias-net
        --restart always
        -p 5672:5672
        -p 15672:15672
        -e RABBITMQ_DEFAULT_USER=guest
        -e RABBITMQ_DEFAULT_PASS=guest
        rabbitmq:3-management-alpine)

    - name: Asegurar que cassandra está corriendo
      shell: |
        docker ps --filter "name=cassandra" --filter "status=running" | grep -q cassandra || \
        (docker rm -f cassandra 2>/dev/null || true; \
         docker run -d \
           --name cassandra \
           --network pasantias-net \
           --restart always \
           -p 9042:9042 \
           -e MAX_HEAP_SIZE=256M \
           -e HEAP_NEWSIZE=128M \
           -v cassandra_data:/var/lib/cassandra \
           cassandra:4.1)

    - name: Asegurar que elasticsearch está corriendo
      shell: |
        docker ps --filter "name=elasticsearch" --filter "status=running" | grep -q elasticsearch || \
        (docker rm -f elasticsearch 2>/dev/null || true; \
         docker run -d \
           --name elasticsearch \
           --network pasantias-net \
           --restart always \
           -p 9200:9200 \
           -e discovery.type=single-node \
           -e ES_JAVA_OPTS="-Xms256m -Xmx256m" \
           -e xpack.security.enabled=false \
           -v elasticsearch_data:/usr/share/elasticsearch/data \
           elasticsearch:8.12.0)

    - name: Asegurar que influxdb está corriendo
      shell: |
        docker ps --filter "name=influxdb" --filter "status=running" | grep -q influxdb || \
        (docker rm -f influxdb 2>/dev/null || true; \
         docker run -d \
           --name influxdb \
           --network pasantias-net \
           --restart always \
           -p 8096:8086 \
           -e DOCKER_INFLUXDB_INIT_MODE=setup \
           -e DOCKER_INFLUXDB_INIT_USERNAME=admin \
           -e DOCKER_INFLUXDB_INIT_PASSWORD=pasantias123 \
           -e DOCKER_INFLUXDB_INIT_ORG=pasantias-uce \
           -e DOCKER_INFLUXDB_INIT_BUCKET=horas-metricas \
           -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=pasantias-token \
           -v influxdb_data:/var/lib/influxdb2 \
           influxdb:2.7)

    - name: Asegurar que etcd está corriendo
      shell: |
        docker ps --filter "name=etcd" --filter "status=running" | grep -q etcd || \
        (docker rm -f etcd 2>/dev/null || true; \
         docker run -d \
           --name etcd \
           --network pasantias-net \
           --restart always \
           -p 2379:2379 \
           -e ALLOW_NONE_AUTHENTICATION=yes \
           gcr.io/etcd-development/etcd:v3.5.0 \
           /usr/local/bin/etcd \
           --name s1 \
           --data-dir /etcd-data \
           --listen-client-urls http://0.0.0.0:2379 \
           --advertise-client-urls http://etcd:2379 \
           --listen-peer-urls http://0.0.0.0:2380 \
           --initial-advertise-peer-urls http://etcd:2380 \
           --initial-cluster s1=http://etcd:2380 \
           --initial-cluster-state new \
           --log-level info)

    - name: Levantar hours-service
      shell: >
        docker run -d --name hours-service
        --network pasantias-net
        --restart always
        -p 8085:8085
        -e DB_HOST=postgres-db
        -e DB_PORT=5432
        -e DB_NAME=hours_db
        -e DB_USER=postgres
        -e DB_PASSWORD=postgres
        -e JWT_SECRET='v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq'
        -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092
        -e MONGO_URI=mongodb://mongodb:27017/hours_read_db
        -e USER_SERVICE_GRPC_HOST=user-service
        -e USER_SERVICE_GRPC_PORT=9083
        gdmuzo/hours-service:latest

    - name: Levantar evaluation-service
      shell: >
        docker run -d --name evaluation-service
        --network pasantias-net
        --restart always
        -p 8086:8086
        -e DB_HOST=postgres-db
        -e DB_PORT=5432
        -e DB_NAME=evaluation_db
        -e DB_USER=postgres
        -e DB_PASSWORD=postgres
        -e JWT_SECRET='v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq'
        -e USER_SERVICE_GRPC_HOST=user-service
        -e USER_SERVICE_GRPC_PORT=9083
        gdmuzo/evaluation-service:latest

    - name: Levantar notification-service
      shell: >
        docker run -d --name notification-service
        --network pasantias-net
        --restart always
        -p 8087:8087
        -e DB_HOST=postgres-db
        -e DB_PORT=5432
        -e DB_NAME=notification_db
        -e DB_USER=postgres
        -e DB_PASSWORD=postgres
        -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092
        -e MQTT_HOST=mosquitto
        -e MQTT_PORT=1883
        -e MQTT_USER=notifuser
        -e MQTT_PASSWORD=MqttN0t1f2026Uce
        gdmuzo/notification-service:latest

    - name: Levantar document-service
      shell: >
        docker run -d --name document-service
        --network pasantias-net
        --restart always
        -p 8088:8088
        -e DB_HOST=postgres-db
        -e DB_PORT=5432
        -e DB_NAME=document_db
        -e DB_USER=postgres
        -e DB_PASSWORD=postgres
        -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092
        -e MONGO_URI=mongodb://mongodb:27017/document_read_db
        -e S3_BUCKET_NAME=pasantias-documents-prod
        -e AWS_ACCESS_KEY_ID={{ aws_access_key_id }}
        -e AWS_SECRET_ACCESS_KEY={{ aws_secret_access_key }}
        -e AWS_SESSION_TOKEN={{ aws_session_token }}
        -e N8N_WEBHOOK_URL=http://{{ ansible_host }}:5678/webhook/document-generated
        gdmuzo/document-service:latest

    - name: Levantar report-service
      shell: >
        docker run -d --name report-service
        --network pasantias-net
        --restart always
        -p 8089:8089
        -e DB_HOST=postgres-db
        -e DB_PORT=5432
        -e DB_NAME=report_db
        -e DB_USER=postgres
        -e DB_PASSWORD=postgres
        -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092
        -e MONGO_URI=mongodb://mongodb:27017/report_read_db
        -e DOCUMENT_SERVICE_URL=http://document-service:8088
        gdmuzo/report-service:latest

    - name: Levantar ai-service
      shell: >
        docker run -d --name ai-service
        --network pasantias-net
        --restart always
        --health-cmd="curl -f http://localhost:8090/health || exit 1"
        --health-interval=30s
        --health-timeout=10s
        --health-retries=3
        --health-start-period=40s
        -p 8090:8090
        -e RABBITMQ_HOST=rabbitmq
        -e RABBITMQ_PORT=5672
        -e RABBITMQ_USER=guest
        -e RABBITMQ_PASSWORD=guest
        gdmuzo/ai-service:latest

    - name: Levantar gateway-service
      shell: |
        docker run -d \
          --name gateway-service \
          --network pasantias-net \
          --restart always \
          -p 8082:8082 \
          -e AUTH_SERVICE_URL=http://auth-service:8080 \
          -e INTERNSHIP_SERVICE_URL=http://internship-service:8081 \
          -e USER_SERVICE_URL=http://user-service:8083 \
          -e LINKAGE_SERVICE_URL=http://linkage-service:8084 \
          -e REDIS_HOST=redis \
          -e REDIS_PORT=6379 \
          -e JWT_SECRET='v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq' \
          {{ docker_image_gateway }}

    - name: Levantar frontend-web
      shell: |
        docker run -d \
          --name frontend-web \
          --network pasantias-net \
          --restart always \
          -p 80:80 \
          {{ docker_image_frontend }}

    # ── Verificación ─────────────────────
    - name: Estado de los contenedores
      shell: docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: container_status

    - name: Mostrar estado
      debug:
        var: container_status.stdout_lines

    - name: Crear directorio de backups
      shell: |
        mkdir -p /opt/backups/postgres
        mkdir -p /opt/backup
      
    - name: Copiar script de backup
      copy:
        dest: /opt/backup/backup_postgres.sh
        mode: '0755'
        content: |
          #!/bin/bash
          DATE=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="/opt/backups/postgres"
          LOG_FILE="/var/log/backup_postgres.log"
          DATABASES=(auth_db internship_db user_db linkage_db hours_db evaluation_db notification_db document_db report_db)
          mkdir -p $BACKUP_DIR
          echo "[$(date)] Iniciando backup" >> $LOG_FILE
          for DB in "${DATABASES[@]}"; do
            docker exec postgres-db pg_dump -U postgres -d $DB 2>/dev/null | gzip > $BACKUP_DIR/${DB}_${DATE}.sql.gz
            echo "[$(date)] $DB respaldada" >> $LOG_FILE
          done
          find $BACKUP_DIR -name "*.sql.gz" -mtime +7 -delete
          echo "[$(date)] Backup completado" >> $LOG_FILE

    - name: Configurar cron job para backup diario a las 2am
      cron:
        name: "Backup PostgreSQL diario"
        minute: "0"
        hour: "2"
        job: "/opt/backup/backup_postgres.sh >> /var/log/backup_postgres.log 2>&1"
        user: ubuntu
        state: present

    - name: Crear directorio de backups en bastion (on-premise simulado)
      delegate_to: "{{ bastion_host | default('10.0.1.166') }}"
      shell: mkdir -p /opt/backups/postgres
      ignore_errors: true

