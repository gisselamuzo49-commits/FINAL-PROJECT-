---
# ─────────────────────────────────────────
# Ansible Playbook — Deploy QA
# Despliega los 3 servicios en el EC2 privado de QA
# vía bastion host (el ProxyCommand lo configura el workflow)
# ─────────────────────────────────────────
- name: Deploy QA — auth-service, internship-service, user-service, linkage-service, frontend-web
  hosts: all
  become: true

  vars:
    docker_image_auth:        "gdmuzo/auth-service:qa"
    docker_image_internship:  "gdmuzo/internship-service:qa"
    docker_image_user:        "gdmuzo/user-service:qa"
    docker_image_linkage:     "gdmuzo/linkage-service:qa"
    docker_image_gateway:     "gdmuzo/gateway-service:qa"
    docker_image_frontend:    "gdmuzo/frontend-web:qa"
    db_dir:                   "/var/lib/pasantias"

  tasks:

    # ── Prerequisitos ────────────────────
    - name: Asegurar que Docker está corriendo
      service:
        name: docker
        state: started
        enabled: true

    - name: Crear directorio para bases de datos SQLite
      file:
        path: "{{ db_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Asegurar que los archivos .db existen (evitar que Docker monte directorios)
      file:
        path: "{{ db_dir }}/{{ item }}"
        state: touch
        mode: "0644"
      loop:
        - auth.db
        - internship.db
        - user.db
        - linkage.db

    - name: Asegurar que existe la red de Docker para intercomunicación
      shell: docker network create pasantias-net 2>/dev/null || true

    # ── Pull de imágenes ─────────────────
    - name: Pull auth-service image
      shell: docker pull {{ docker_image_auth }}

    - name: Pull internship-service image
      shell: docker pull {{ docker_image_internship }}

    - name: Pull user-service image
      shell: docker pull {{ docker_image_user }}

    - name: Pull linkage-service image
      shell: docker pull {{ docker_image_linkage }}

    - name: Pull gateway-service image
      shell: docker pull {{ docker_image_gateway }}

    - name: Pull frontend-web image
      shell: docker pull {{ docker_image_frontend }}

    # ── Detener y remover contenedores viejos ──
    - name: Detener y remover contenedores existentes
      shell: |
        docker stop auth-service internship-service user-service linkage-service gateway-service frontend-web 2>/dev/null || true
        docker rm   auth-service internship-service user-service linkage-service gateway-service frontend-web 2>/dev/null || true

    # ── Levantar contenedores ────────────
    - name: Levantar auth-service
      shell: |
        docker run -d \
          --name auth-service \
          --network pasantias-net \
          --restart always \
          -p 8080:8080 \
          -v {{ db_dir }}/auth.db:/app/auth.db \
          {{ docker_image_auth }}

    - name: Levantar internship-service
      shell: |
        docker run -d \
          --name internship-service \
          --network pasantias-net \
          --restart always \
          -p 8081:8081 \
          -v {{ db_dir }}/internship.db:/app/internship.db \
          {{ docker_image_internship }}

    - name: Levantar user-service
      shell: |
        docker run -d \
          --name user-service \
          --network pasantias-net \
          --restart always \
          -p 8083:8083 \
          -v {{ db_dir }}/user.db:/app/user.db \
          {{ docker_image_user }}

    - name: Levantar linkage-service
      shell: |
        docker run -d \
          --name linkage-service \
          --network pasantias-net \
          --restart always \
          -p 8084:8084 \
          -v {{ db_dir }}/linkage.db:/app/linkage.db \
          {{ docker_image_linkage }}

    - name: Levantar gateway-service
      shell: |
        docker run -d \
          --name gateway-service \
          --network pasantias-net \
          --restart always \
          -p 8082:8082 \
          -e AUTH_SERVICE_URL=http://auth-service:8080 \
          -e INTERNSHIP_SERVICE_URL=http://internship-service:8081 \
          -e USER_SERVICE_URL=http://user-service:8083 \
          -e LINKAGE_SERVICE_URL=http://linkage-service:8084 \
          -e JWT_SECRET=v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq \
          {{ docker_image_gateway }}

    - name: Levantar frontend-web
      shell: |
        docker run -d \
          --name frontend-web \
          --network pasantias-net \
          --restart always \
          -p 80:80 \
          {{ docker_image_frontend }}

    # ── Verificación ─────────────────────
    - name: Estado de los contenedores
      shell: docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: container_status

    - name: Mostrar estado
      debug:
        var: container_status.stdout_lines
