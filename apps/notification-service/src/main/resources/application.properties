spring.application.name=notification-service
server.port=8087

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Configuración de Apache Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Configuración de MQTT Broker (Mosquitto self-hosted por defecto)
mqtt.broker.host=${MQTT_HOST:localhost}
mqtt.broker.port=${MQTT_PORT:1883}
mqtt.broker.username=${MQTT_USERNAME:notifuser}
mqtt.broker.password=${MQTT_PASSWORD}
mqtt.broker.client-id=${MQTT_CLIENT_ID:notification-service-client}

# Swagger UI / OpenAPI config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración de Cassandra
spring.cassandra.contact-points=${CASSANDRA_HOST:cassandra}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:pasantias_events}
spring.cassandra.local-datacenter=${CASSANDRA_DC:datacenter1}
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# Logging Config
logging.level.root=INFO
logging.level.com.uce=${LOG_LEVEL_UCE:INFO}
