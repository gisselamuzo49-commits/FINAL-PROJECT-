spring.profiles.active=test
spring.application.name=report-service-test

# Configuración de Base de Datos H2 en memoria para Pruebas
spring.datasource.url=jdbc:h2:mem:report_test_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Configuración de MongoDB para Pruebas
spring.mongodb.uri=mongodb://localhost:27017/report_test_db

# Configuración de Apache Kafka para Pruebas
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=report-service-test-group

# Integración con document-service
document.service.url=http://localhost:8088

# Configuración de InfluxDB para Pruebas
influxdb.url=http://localhost:8086
influxdb.token=test-only-influxdb-token
influxdb.org=pasantias-uce
influxdb.bucket=horas-metricas

# Excluir auto-configuraciones de base de datos no deseadas en tests si aplica
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
