# Configuración del API Gateway
logging:
  level:
    root: INFO
    com.uce: DEBUG

server:
  port: 8082

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                allowCredentials: true
                maxAge: 3600
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - CircuitBreaker=name=default,fallbackUri=forward:/fallback
          # --- RUTAS: Enrutamiento a los microservicios internos ---
          # Las URIs usan variables de entorno para funcionar tanto en local (localhost)
          # como en Docker (nombres de servicio de docker-compose).
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/auth/**

            - id: internship-service
              uri: ${INTERNSHIP_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/internships/**
              filters:
                - name: JwtAuthenticationFilter

            - id: user-service-health
              uri: ${USER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/users/health
              filters:
                - RewritePath=/api/users/health, /health

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/users/**
              filters:
                - name: JwtAuthenticationFilter

            - id: linkage-service-health
              uri: ${LINKAGE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/linkage/health
              filters:
                - RewritePath=/api/linkage/health, /health

            - id: linkage-service
              uri: ${LINKAGE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/linkage/**
              filters:
                - name: JwtAuthenticationFilter

            - id: hours-health
              uri: ${HOURS_SERVICE_URL:http://hours-service:8085}
              predicates:
                - Path=/api/hours/health
              filters:
                - RewritePath=/api/hours/health, /health

            - id: hours-service
              uri: ${HOURS_SERVICE_URL:http://hours-service:8085}
              predicates:
                - Path=/api/hours/**
              filters:
                - name: JwtAuthenticationFilter

            - id: evaluation-health
              uri: ${EVALUATION_SERVICE_URL:http://evaluation-service:8086}
              predicates:
                - Path=/api/evaluation/health
              filters:
                - RewritePath=/api/evaluation/health, /health

            - id: evaluation-service
              uri: ${EVALUATION_SERVICE_URL:http://evaluation-service:8086}
              predicates:
                - Path=/api/evaluations/**
              filters:
                - name: JwtAuthenticationFilter

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8087}
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: JwtAuthenticationFilter

            - id: notification-ws
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8087}
              predicates:
                - Path=/ws/**
              filters:
                - name: JwtAuthenticationFilter

            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://document-service:8088}
              predicates:
                - Path=/api/documents/**
              filters:
                - name: JwtAuthenticationFilter

            - id: report-service
              uri: ${REPORT_SERVICE_URL:http://report-service:8089}
              predicates:
                - Path=/api/reports/**
              filters:
                - name: JwtAuthenticationFilter

            - id: ai-service
              uri: ${AI_SERVICE_URL:http://ai-service:8090}
              predicates:
                - Path=/api/ai/**
              filters:
                - name: JwtAuthenticationFilter


# Configuración de seguridad JWT compartida
security:
  jwt:
    secret: ${JWT_SECRET}

# Configuración de etcd (Configuración Distribuida)
etcd:
  endpoints: ${ETCD_ENDPOINTS:http://etcd:2379}
