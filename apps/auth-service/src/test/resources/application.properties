spring.application.name=auth-service-test

# Configuración de Base de Datos H2 en memoria para Pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Configuración JWT
security.jwt.secret=test-only-secret-not-used-in-production-0123456789abcdef

# Logging — silenciar Logstash encoder en tests
logging.level.root=WARN
logging.level.com.uce=WARN
spring.profiles.active=test
