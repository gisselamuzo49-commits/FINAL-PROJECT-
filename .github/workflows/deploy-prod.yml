name: Deploy to PROD

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      internship: ${{ steps.filter.outputs.internship }}
      user: ${{ steps.filter.outputs.user }}
      linkage: ${{ steps.filter.outputs.linkage }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      hours: ${{ steps.filter.outputs.hours }}
      evaluation: ${{ steps.filter.outputs.evaluation }}
      notification: ${{ steps.filter.outputs.notification }}
      document: ${{ steps.filter.outputs.document }}
      report: ${{ steps.filter.outputs.report }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: 'apps/auth-service/**'
            internship: 'apps/internship-service/**'
            user: 'apps/user-service/**'
            linkage: 'apps/linkage-service/**'
            gateway: 'apps/gateway-service/**'
            frontend: 'apps/frontend-web/**'
            hours: 'apps/hours-service/**'
            evaluation: 'apps/evaluation-service/**'
            notification: 'apps/notification-service/**'
            document: 'apps/document-service/**'
            report: 'apps/report-service/**'
            ai: 'apps/ai-service/**'
            infra: 'infra/**'

  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ci-test-only-password
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests - auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        run: |
          cd apps/auth-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - internship-service
        if: needs.detect-changes.outputs.internship == 'true'
        run: |
          cd apps/internship-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - user-service
        if: needs.detect-changes.outputs.user == 'true'
        run: |
          cd apps/user-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - linkage-service
        if: needs.detect-changes.outputs.linkage == 'true'
        run: |
          cd apps/linkage-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - gateway-service
        if: needs.detect-changes.outputs.gateway == 'true'
        run: |
          cd apps/gateway-service
          chmod +x mvnw
          ./mvnw test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: gdmuzo/auth-service:latest

      - name: Build and push internship-service
        if: needs.detect-changes.outputs.internship == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/internship-service
          push: true
          tags: gdmuzo/internship-service:latest

      - name: Build and push user-service
        if: needs.detect-changes.outputs.user == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/user-service
          push: true
          tags: gdmuzo/user-service:latest

      - name: Build and push linkage-service
        if: needs.detect-changes.outputs.linkage == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/linkage-service
          push: true
          tags: gdmuzo/linkage-service:latest

      - name: Build and push gateway-service
        if: needs.detect-changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/gateway-service
          push: true
          tags: gdmuzo/gateway-service:latest

      - name: Build and push frontend-web
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend-web
          push: true
          tags: gdmuzo/frontend-web:latest
          build-args: |
            VITE_GATEWAY_PORT=8082
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build and push hours-service
        if: needs.detect-changes.outputs.hours == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/hours-service
          push: true
          tags: gdmuzo/hours-service:latest

      - name: Build and push evaluation-service
        if: needs.detect-changes.outputs.evaluation == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/evaluation-service
          push: true
          tags: gdmuzo/evaluation-service:latest

      - name: Build and push notification-service
        if: needs.detect-changes.outputs.notification == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/notification-service
          push: true
          tags: gdmuzo/notification-service:latest

      - name: Build and push document-service
        if: needs.detect-changes.outputs.document == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/document-service
          push: true
          tags: gdmuzo/document-service:latest

      - name: Build and push report-service
        if: needs.detect-changes.outputs.report == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/report-service
          push: true
          tags: gdmuzo/report-service:latest

      - name: Build and push ai-service
        if: needs.detect-changes.outputs.ai == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-service
          push: true
          tags: gdmuzo/ai-service:latest

      # ── SSH setup ─────────────────────────────────────────────────────────────
      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/PROD.pem
          chmod 400 ~/.ssh/PROD.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_IP }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.PROD_BASTION_IP }} \
            "ssh-keyscan -H ${{ secrets.PROD_AUTH_JOBS_IP }}" >> ~/.ssh/known_hosts || true

      # ── Ansible inventory ──────────────────────────────────────────────────────
      - name: Create Ansible inventory
        run: |
          cat > /tmp/prod_inventory.ini << EOF
          [prod_ec2]
          ${{ secrets.PROD_AUTH_JOBS_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/PROD.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.PROD_BASTION_IP }}"'
          EOF

      - name: Install Ansible
        run: pip install ansible

      - name: Deploy via Ansible
        run: |
          ansible-playbook infra/ansible/deploy-prod.yml \
            -i /tmp/prod_inventory.ini \
            -e "aws_access_key_id=${{ secrets.PROD_AWS_ACCESS_KEY_ID }}" \
            -e "aws_secret_access_key=${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}" \
            -e "aws_session_token=${{ secrets.PROD_AWS_SESSION_TOKEN }}" \
            -e "dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -e "dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}" \
            -e "supabase_url=${{ secrets.SUPABASE_URL }}" \
            -e "supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -e "jwt_secret=$JWT_SECRET" \
            -e "db_password=$DB_PASSWORD" \
            -e "neo4j_password=$NEO4J_PASSWORD" \
            -e "mqtt_password=$MQTT_PASSWORD" \
            -e "rabbitmq_password=$RABBITMQ_PASSWORD" \
            -e "influxdb_password=$INFLUXDB_PASSWORD" \
            -e "influxdb_token=$INFLUXDB_TOKEN" \
            -e "allowed_origins=$ALLOWED_ORIGINS"
        env:
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.PROD_NEO4J_PASSWORD }}
          MQTT_PASSWORD: ${{ secrets.PROD_MQTT_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.PROD_RABBITMQ_PASSWORD }}
          INFLUXDB_PASSWORD: ${{ secrets.PROD_INFLUXDB_PASSWORD }}
          INFLUXDB_TOKEN: ${{ secrets.PROD_INFLUXDB_TOKEN }}
          ALLOWED_ORIGINS: ${{ vars.PROD_ALLOWED_ORIGINS }}
