name: Deploy to PROD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests - auth-service
        run: |
          cd apps/auth-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - internship-service
        run: |
          cd apps/internship-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - user-service
        run: |
          cd apps/user-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - linkage-service
        run: |
          cd apps/linkage-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - gateway-service
        run: |
          cd apps/gateway-service
          chmod +x mvnw
          ./mvnw test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: gdmuzo/auth-service:latest

      - name: Build and push internship-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/internship-service
          push: true
          tags: gdmuzo/internship-service:latest

      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/user-service
          push: true
          tags: gdmuzo/user-service:latest

      - name: Build and push linkage-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/linkage-service
          push: true
          tags: gdmuzo/linkage-service:latest

      - name: Build and push gateway-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/gateway-service
          push: true
          tags: gdmuzo/gateway-service:latest

      - name: Build and push frontend-web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend-web
          push: true
          tags: gdmuzo/frontend-web:latest
          build-args: |
            VITE_GATEWAY_PORT=8082

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/PROD.pem
          chmod 400 ~/.ssh/PROD.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_IP }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.PROD_BASTION_IP }} \
            "ssh-keyscan -H ${{ secrets.PROD_AUTH_JOBS_IP }}" >> ~/.ssh/known_hosts

      - name: Create Ansible inventory
        run: |
          cat > /tmp/prod_inventory.ini << EOF
          [prod_ec2]
          ${{ secrets.PROD_AUTH_JOBS_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/PROD.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.PROD_BASTION_IP }}"'
          EOF

      - name: Deploy via Ansible
        run: |
          pip install ansible
          ansible-playbook infra/ansible/deploy-prod.yml \
            -i /tmp/prod_inventory.ini
