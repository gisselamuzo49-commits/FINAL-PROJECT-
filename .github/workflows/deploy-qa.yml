name: Deploy to QA

on:
  push:
    branches:
      - QA

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      internship: ${{ steps.filter.outputs.internship }}
      user: ${{ steps.filter.outputs.user }}
      linkage: ${{ steps.filter.outputs.linkage }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      hours: ${{ steps.filter.outputs.hours }}
      evaluation: ${{ steps.filter.outputs.evaluation }}
      notification: ${{ steps.filter.outputs.notification }}
      document: ${{ steps.filter.outputs.document }}
      report: ${{ steps.filter.outputs.report }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: 'apps/auth-service/**'
            internship: 'apps/internship-service/**'
            user: 'apps/user-service/**'
            linkage: 'apps/linkage-service/**'
            gateway: 'apps/gateway-service/**'
            frontend: 'apps/frontend-web/**'
            hours: 'apps/hours-service/**'
            evaluation: 'apps/evaluation-service/**'
            notification: 'apps/notification-service/**'
            document: 'apps/document-service/**'
            report: 'apps/report-service/**'
            ai: 'apps/ai-service/**'
            infra: 'infra/**'

  deploy:
    needs: detect-changes
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests - auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        run: |
          cd apps/auth-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - internship-service
        if: needs.detect-changes.outputs.internship == 'true'
        run: |
          cd apps/internship-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - user-service
        if: needs.detect-changes.outputs.user == 'true'
        run: |
          cd apps/user-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - linkage-service
        if: needs.detect-changes.outputs.linkage == 'true'
        run: |
          cd apps/linkage-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - gateway-service
        if: needs.detect-changes.outputs.gateway == 'true'
        run: |
          cd apps/gateway-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - hours-service
        if: needs.detect-changes.outputs.hours == 'true'
        run: |
          cd apps/hours-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - evaluation-service
        if: needs.detect-changes.outputs.evaluation == 'true'
        run: |
          cd apps/evaluation-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - notification-service
        if: needs.detect-changes.outputs.notification == 'true'
        run: |
          cd apps/notification-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - document-service
        if: needs.detect-changes.outputs.document == 'true'
        run: |
          cd apps/document-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - report-service
        if: needs.detect-changes.outputs.report == 'true'
        run: |
          cd apps/report-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - ai-service
        if: needs.detect-changes.outputs.ai == 'true'
        run: |
          cd apps/ai-service
          pip install -r requirements.txt --user
          python -m pytest test_main.py -v

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: gdmuzo/auth-service:qa

      - name: Build and push internship-service
        if: needs.detect-changes.outputs.internship == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/internship-service
          push: true
          tags: gdmuzo/internship-service:qa

      - name: Build and push user-service
        if: needs.detect-changes.outputs.user == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/user-service
          push: true
          tags: gdmuzo/user-service:qa

      - name: Build and push linkage-service
        if: needs.detect-changes.outputs.linkage == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/linkage-service
          push: true
          tags: gdmuzo/linkage-service:qa

      - name: Build and push gateway-service
        if: needs.detect-changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/gateway-service
          push: true
          tags: gdmuzo/gateway-service:qa

      - name: Build and push frontend-web
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend-web
          push: true
          tags: gdmuzo/frontend-web:qa
          build-args: |
            VITE_GATEWAY_PORT=8082
            VITE_API_BASE_URL=http://${{ secrets.QA_AUTH_JOBS_IP }}:8082

      - name: Build and push hours-service
        if: needs.detect-changes.outputs.hours == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/hours-service
          push: true
          tags: gdmuzo/hours-service:latest

      - name: Build and push evaluation-service
        if: needs.detect-changes.outputs.evaluation == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/evaluation-service
          push: true
          tags: gdmuzo/evaluation-service:latest

      - name: Build and push notification-service
        if: needs.detect-changes.outputs.notification == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/notification-service
          push: true
          tags: gdmuzo/notification-service:latest

      - name: Build and push document-service
        if: needs.detect-changes.outputs.document == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/document-service
          push: true
          tags: gdmuzo/document-service:latest

      - name: Build and push report-service
        if: needs.detect-changes.outputs.report == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/report-service
          push: true
          tags: gdmuzo/report-service:latest

      - name: Build and push ai-service
        if: needs.detect-changes.outputs.ai == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-service
          push: true
          tags: gdmuzo/ai-service:latest

      - name: Create Ansible inventory
        run: |
          echo "[qa_ec2]" > /tmp/qa_inventory.ini
          echo "${{ secrets.QA_AUTH_JOBS_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/QA.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> /tmp/qa_inventory.ini
          cat /tmp/qa_inventory.ini

      - name: Configure Ansible SSH (Local config)
        run: |
          printf '[defaults]\nremote_user = ubuntu\nprivate_key_file = ~/.ssh/QA.pem\nhost_key_checking = False\n' > /tmp/ansible.cfg
          cat /tmp/ansible.cfg

      - name: Deploy via Ansible
        run: |
          echo "=== ANSIBLE_CONFIG ==="
          echo $ANSIBLE_CONFIG
          echo "=== ansible.cfg content ==="
          cat /tmp/ansible.cfg
          echo "=== inventory content ==="
          cat /tmp/qa_inventory.ini
          echo "=== testing ansible connection ==="
          ANSIBLE_CONFIG=/tmp/ansible.cfg ansible \
            -i /tmp/qa_inventory.ini \
            all -m ping \
            -vvv 2>&1 | head -50
          echo "=== running playbook ==="
          ANSIBLE_CONFIG=/tmp/ansible.cfg ansible-playbook infra/ansible/deploy-qa.yml \
            -i /tmp/qa_inventory.ini \
            -e "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e "aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
            -e "qa_public_ip=${{ secrets.QA_AUTH_JOBS_IP }}" \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "pg_password=${{ secrets.PG_PASSWORD }}" \
            -e "neo4j_password=${{ secrets.NEO4J_PASSWORD }}"
        env:
          ANSIBLE_CONFIG: /tmp/ansible.cfg
