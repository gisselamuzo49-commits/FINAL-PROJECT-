name: Deploy to QA

on:
  push:
    branches:
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests - auth-service
        run: |
          cd apps/auth-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - internship-service
        run: |
          cd apps/internship-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - user-service
        run: |
          cd apps/user-service
          chmod +x mvnw
          ./mvnw test

      - name: Run tests - linkage-service
        run: |
          cd apps/linkage-service
          chmod +x mvnw
          ./mvnw test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: gdmuzo/auth-service:qa

      - name: Build and push internship-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/internship-service
          push: true
          tags: gdmuzo/internship-service:qa

      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/user-service
          push: true
          tags: gdmuzo/user-service:qa

      - name: Build and push linkage-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/linkage-service
          push: true
          tags: gdmuzo/linkage-service:qa

      - name: Build and push frontend-web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend-web
          push: true
          tags: gdmuzo/frontend-web:qa
          build-args: |
            VITE_AUTH_PORT=8080
            VITE_INTERNSHIP_PORT=8081

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/QA.pem
          chmod 400 ~/.ssh/QA.pem
          ssh-keyscan -H ${{ secrets.QA_BASTION_IP }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/QA.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.QA_BASTION_IP }} \
            "ssh-keyscan -H ${{ secrets.QA_AUTH_JOBS_IP }}" >> ~/.ssh/known_hosts

      - name: Create Ansible inventory
        run: |
          cat > /tmp/qa_inventory.ini << EOF
          [qa_ec2]
          ${{ secrets.QA_AUTH_JOBS_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/QA.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/QA.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.QA_BASTION_IP }}"'
          EOF

      - name: Deploy via Ansible
        run: |
          pip install ansible
          ansible-playbook infra/ansible/deploy-qa.yml \
            -i /tmp/qa_inventory.ini
