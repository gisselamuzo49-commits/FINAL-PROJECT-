name: Deploy to QA

on:
  push:
    branches:
      - QA

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  # ── Detectar cambios ──────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      internship: ${{ steps.filter.outputs.internship }}
      user: ${{ steps.filter.outputs.user }}
      linkage: ${{ steps.filter.outputs.linkage }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      hours: ${{ steps.filter.outputs.hours }}
      evaluation: ${{ steps.filter.outputs.evaluation }}
      notification: ${{ steps.filter.outputs.notification }}
      document: ${{ steps.filter.outputs.document }}
      report: ${{ steps.filter.outputs.report }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: 'apps/auth-service/**'
            internship: 'apps/internship-service/**'
            user: 'apps/user-service/**'
            linkage: 'apps/linkage-service/**'
            gateway: 'apps/gateway-service/**'
            frontend: 'apps/frontend-web/**'
            hours: 'apps/hours-service/**'
            evaluation: 'apps/evaluation-service/**'
            notification: 'apps/notification-service/**'
            document: 'apps/document-service/**'
            report: 'apps/report-service/**'
            ai: 'apps/ai-service/**'
            infra: 'infra/**'

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: detect-changes
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: v9y$B&E)H@McQfTjWmZq4t7w!z%C*F-JaNdRgUkXp2r5u8x/A?D(G+KbPeShVmYq
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests - auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        run: cd apps/auth-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - internship-service
        if: needs.detect-changes.outputs.internship == 'true'
        run: cd apps/internship-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - user-service
        if: needs.detect-changes.outputs.user == 'true'
        run: cd apps/user-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - linkage-service
        if: needs.detect-changes.outputs.linkage == 'true'
        run: cd apps/linkage-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - gateway-service
        if: needs.detect-changes.outputs.gateway == 'true'
        run: cd apps/gateway-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - hours-service
        if: needs.detect-changes.outputs.hours == 'true'
        run: cd apps/hours-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - evaluation-service
        if: needs.detect-changes.outputs.evaluation == 'true'
        run: cd apps/evaluation-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - notification-service
        if: needs.detect-changes.outputs.notification == 'true'
        run: cd apps/notification-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - document-service
        if: needs.detect-changes.outputs.document == 'true'
        run: cd apps/document-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - report-service
        if: needs.detect-changes.outputs.report == 'true'
        run: cd apps/report-service && chmod +x mvnw && ./mvnw test
      - name: Run tests - ai-service
        if: needs.detect-changes.outputs.ai == 'true'
        run: |
          cd apps/ai-service
          pip install -r requirements.txt --user
          python -m pytest test_main.py -v

  # ── Build jobs en paralelo ────────────────────────────────────────────────────
  build-auth:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.auth == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: gdmuzo/auth-service:qa

  build-internship:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.internship == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/internship-service
          push: true
          tags: gdmuzo/internship-service:qa

  build-user:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.user == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/user-service
          push: true
          tags: gdmuzo/user-service:qa

  build-linkage:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.linkage == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/linkage-service
          push: true
          tags: gdmuzo/linkage-service:qa

  build-gateway:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/gateway-service
          push: true
          tags: gdmuzo/gateway-service:qa

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend-web
          push: true
          tags: gdmuzo/frontend-web:qa
          build-args: |
            VITE_GATEWAY_PORT=8082
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

  build-hours:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.hours == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/hours-service
          push: true
          tags: gdmuzo/hours-service:latest

  build-evaluation:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.evaluation == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/evaluation-service
          push: true
          tags: gdmuzo/evaluation-service:latest

  build-notification:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.notification == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/notification-service
          push: true
          tags: gdmuzo/notification-service:latest

  build-document:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.document == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/document-service
          push: true
          tags: gdmuzo/document-service:latest

  build-report:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.report == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/report-service
          push: true
          tags: gdmuzo/report-service:latest

  build-ai:
    runs-on: ubuntu-latest
    needs: test
    if: needs.detect-changes.outputs.ai == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-service
          push: true
          tags: gdmuzo/ai-service:latest

  # ── Deploy via Ansible ────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - test
      - build-auth
      - build-internship
      - build-user
      - build-linkage
      - build-gateway
      - build-frontend
      - build-hours
      - build-evaluation
      - build-notification
      - build-document
      - build-report
      - build-ai
    if: always() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/QA.pem
          chmod 400 ~/.ssh/QA.pem
          ssh-keyscan -H ${{ secrets.QA_BASTION_IP }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/QA.pem \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            ubuntu@${{ secrets.QA_BASTION_IP }} \
            "ssh-keyscan -H ${{ secrets.QA_AUTH_JOBS_IP }}" >> ~/.ssh/known_hosts || true

      - name: Create Ansible inventory
        run: |
          echo "[qa_ec2]" > /tmp/qa_inventory.ini
          echo "${{ secrets.QA_AUTH_JOBS_IP }}" >> /tmp/qa_inventory.ini

      - name: Configure Ansible SSH
        run: |
          printf '[defaults]\nremote_user = ubuntu\nprivate_key_file = ~/.ssh/QA.pem\nhost_key_checking = False\n\n[ssh_connection]\nssh_args = -o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %%h:%%p -i ~/.ssh/QA.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.QA_BASTION_IP }}"\n' > /tmp/ansible.cfg

      - name: Install Ansible
        run: pip install ansible

      - name: Test Ansible connection
        run: |
          ANSIBLE_CONFIG=/tmp/ansible.cfg ansible \
            -i /tmp/qa_inventory.ini \
            all -m ping -vvv 2>&1 | head -60
        env:
          ANSIBLE_CONFIG: /tmp/ansible.cfg

      - name: Deploy via Ansible
        run: |
          ANSIBLE_CONFIG=/tmp/ansible.cfg ansible-playbook infra/ansible/deploy-qa.yml \
            -i /tmp/qa_inventory.ini \
            -e "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e "aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
            -e "dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -e "dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}" \
            -e "supabase_url=${{ secrets.SUPABASE_URL }}" \
            -e "supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}"
        env:
          ANSIBLE_CONFIG: /tmp/ansible.cfg

  # ── Load Testing con k6 ───────────────────────────────────────
  load-test:
    name: K6 Load Testing
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: [self-hosted, linux, x64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Instalar k6 si no existe
        run: |
          if ! command -v k6 &> /dev/null; then
            sudo gpg -k
            sudo gpg --no-default-keyring \
              --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
              --keyserver hkp://keyserver.ubuntu.com:80 \
              --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
              https://dl.k6.io/deb stable main" | \
              sudo tee /etc/apt/sources.list.d/k6.list
            sudo apt-get update
            sudo apt-get install k6 -y
          fi

      - name: Esperar que los servicios estén listos
        run: sleep 30

      - name: Run k6 load test
        env:
          TARGET_HOST: "10.0.1.251"
        run: |
          k6 run \
            --vus 20 \
            --duration 30s \
            -e TARGET_HOST=$TARGET_HOST \
            tests/load/k6-all-services.js

  e2e-tests:
    name: Cypress E2E Tests
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Esperar que los servicios estén listos
        run: sleep 60

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          record: true
          browser: chrome
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_BASE_URL: http://54.227.79.26
